<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>01 — Debug GUI Panel v5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    #debug {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #555;
      border-radius: 8px;
      padding: 16px 20px;
      color: #fff;
      font: 16px/2 monospace;
      min-width: 260px;
      z-index: 10;
    }
    #debug h3 {
      font-size: 14px;
      color: #88ccff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #debug label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    #debug span.name { flex: 0 0 100px; font-size: 14px; color: #ccc; }
    #debug span.val  { flex: 0 0 36px; text-align: right; font-size: 14px; color: #fff; }
    #debug input[type=range] {
      flex: 1;
      accent-color: #00aaff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="debug">
    <h3>Visual Debug</h3>
    <label><span class="name">ambient</span>    <input type="range" id="s-ambient"  min="0" max="1" step="0.01" value="0.15"> <span class="val" id="v-ambient">0.15</span></label>
    <label><span class="name">key light</span>  <input type="range" id="s-key"      min="0" max="3" step="0.01" value="1.8">  <span class="val" id="v-key">1.80</span></label>
    <label><span class="name">glow</span>       <input type="range" id="s-glow"     min="0" max="2" step="0.01" value="0.8">  <span class="val" id="v-glow">0.80</span></label>
    <label><span class="name">bloom</span>      <input type="range" id="s-bloom"    min="0" max="1" step="0.01" value="0.3">  <span class="val" id="v-bloom">0.30</span></label>
  </div>

  <script type="module">
    import { Engine } from '@babylonjs/core/Engines/engine'
    import { Scene } from '@babylonjs/core/scene'
    import { ArcRotateCamera } from '@babylonjs/core/Cameras/arcRotateCamera'
    import { HemisphericLight } from '@babylonjs/core/Lights/hemisphericLight'
    import { DirectionalLight } from '@babylonjs/core/Lights/directionalLight'
    import { MeshBuilder } from '@babylonjs/core/Meshes/meshBuilder'
    import { StandardMaterial } from '@babylonjs/core/Materials/standardMaterial'
    import { Color3, Color4, Vector3 } from '@babylonjs/core/Maths/math'
    import { GlowLayer } from '@babylonjs/core/Layers/glowLayer'
    import { DefaultRenderingPipeline } from '@babylonjs/core/PostProcesses/RenderPipeline/Pipelines/defaultRenderingPipeline'

    // ── Engine + Scene ────────────────────────────────────────────────────────
    const canvas = document.getElementById('renderCanvas')
    const engine = new Engine(canvas, true)
    const scene = new Scene(engine)
    scene.clearColor = new Color4(0.01, 0.01, 0.02, 1)

    // ── Camera ────────────────────────────────────────────────────────────────
    const camera = new ArcRotateCamera('cam', -Math.PI / 4, Math.PI / 3, 6, Vector3.Zero(), scene)
    camera.attachControl(canvas, true)

    // ── Lighting ──────────────────────────────────────────────────────────────
    const ambient = new HemisphericLight('ambient', new Vector3(0, 1, 0), scene)
    ambient.intensity = 0.15
    ambient.groundColor = new Color3(0.02, 0.02, 0.05)

    const key = new DirectionalLight('key', new Vector3(-0.5, -1, 0.8), scene)
    key.intensity = 1.8

    // ── Meshes ────────────────────────────────────────────────────────────────
    const ground = MeshBuilder.CreateGround('ground', { width: 6, height: 6 }, scene)
    const groundMat = new StandardMaterial('groundMat', scene)
    groundMat.diffuseColor = new Color3(0.05, 0.05, 0.08)
    ground.material = groundMat

    const blade = MeshBuilder.CreateCylinder('blade', { height: 1.2, diameter: 0.04, tessellation: 12 }, scene)
    blade.position.y = 0.9
    const bladeMat = new StandardMaterial('bladeMat', scene)
    bladeMat.emissiveColor = new Color3(0, 0.85, 1)
    bladeMat.disableLighting = true
    blade.material = bladeMat

    const orb = MeshBuilder.CreateSphere('orb', { diameter: 0.4, segments: 16 }, scene)
    orb.position.set(1.8, 0.8, -0.5)
    const orbMat = new StandardMaterial('orbMat', scene)
    orbMat.emissiveColor = new Color3(0.8, 0, 1)
    orbMat.disableLighting = true
    orb.material = orbMat

    // ── Glow ──────────────────────────────────────────────────────────────────
    const gl = new GlowLayer('glow', scene, { mainTextureRatio: 0.5, blurKernelSize: 64 })
    gl.intensity = 0.8

    // ── Post-processing ───────────────────────────────────────────────────────
    const pipeline = new DefaultRenderingPipeline('pipeline', true, scene, [camera])
    pipeline.bloomEnabled = true
    pipeline.bloomThreshold = 0.8
    pipeline.bloomWeight = 0.3
    pipeline.bloomKernel = 64
    pipeline.bloomScale = 0.5
    pipeline.fxaaEnabled = true

    // ── Wire HTML sliders to scene objects ────────────────────────────────────
    function wire(sliderId, valId, onChange) {
      const slider = document.getElementById(sliderId)
      const val    = document.getElementById(valId)
      slider.addEventListener('input', () => {
        const v = parseFloat(slider.value)
        val.textContent = v.toFixed(2)
        onChange(v)
      })
    }

    wire('s-ambient', 'v-ambient', v => { ambient.intensity = v })
    wire('s-key',     'v-key',     v => { key.intensity = v })
    wire('s-glow',    'v-glow',    v => { gl.intensity = v })
    wire('s-bloom',   'v-bloom',   v => { pipeline.bloomWeight = v })

    // ── Render loop ───────────────────────────────────────────────────────────
    engine.runRenderLoop(() => scene.render())
    window.addEventListener('resize', () => engine.resize())
  </script>
</body>
</html>
